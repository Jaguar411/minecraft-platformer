<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blocky Mountain Run</title>
  <style>
    :root {
      --tile: 44px;
      --columns: 16;
      --sky: #91d7f2;
      --grass: #5eaf43;
      --dirt: #8c5735;
      --stone: #777d84;
      --lava: #f36b22;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #17251a;
      background: linear-gradient(#b8e9fb, #eaf8df);
      font-family: system-ui, sans-serif;
    }

    .game-card {
      width: min(100%, 790px);
      padding: 22px;
      border: 4px solid #345b38;
      border-radius: 12px;
      background: #fffdf2;
      box-shadow: 0 10px 0 #345b38;
    }

    h1 { margin: 0 0 6px; font-size: clamp(1.5rem, 4vw, 2rem); }
    .intro { margin: 0 0 16px; }

    #world {
      position: relative;
      width: calc(var(--tile) * var(--columns));
      max-width: 100%;
      height: calc(var(--tile) * 8);
      overflow: hidden;
      border: 3px solid #47779a;
      background: linear-gradient(#83d2f1 0 72%, #b4e8f4 72% 100%);
      image-rendering: pixelated;
    }

    .cloud {
      position: absolute;
      top: 35px;
      width: 78px;
      height: 18px;
      border-radius: 20px;
      background: #f7ffff;
      box-shadow: 18px -10px 0 2px #f7ffff, 36px 0 0 #f7ffff;
      opacity: .85;
    }
    .cloud.one { left: 65px; }
    .cloud.two { right: 110px; top: 85px; transform: scale(.7); }

    #terrain {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(var(--columns), var(--tile));
      grid-template-rows: repeat(8, var(--tile));
    }

    .tile { position: relative; }
    .ground {
      grid-row: 8;
      background: linear-gradient(var(--grass) 0 22%, var(--dirt) 22% 100%);
      border: 1px solid #70452e;
    }
    .ground::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 5px;
      background: #83d351;
    }
    .lava {
      grid-row: 8;
      background: linear-gradient(#ffb52e 0 15%, #f36b22 15% 100%);
      border: 1px solid #b8431d;
      animation: glow 700ms alternate infinite;
    }
    .lava::before {
      content: "";
      position: absolute;
      inset: 5px 3px auto;
      height: 5px;
      background: #ffe566;
    }
    .stone-block {
      position: absolute;
      left: calc(var(--tile) * 10);
      bottom: var(--tile);
      width: var(--tile);
      height: var(--tile);
      border: 3px solid #5f666c;
      background: repeating-linear-gradient(135deg, #90979c 0 9px, #7c848a 9px 18px);
      box-shadow: inset 0 0 0 3px #aeb4b8;
    }
    .emerald {
      position: absolute;
      z-index: 1;
      left: calc(var(--tile) * 15 + 10px);
      bottom: calc(var(--tile) + 7px);
      width: 24px;
      height: 28px;
      border: 3px solid #147346;
      background: linear-gradient(135deg, #91ffae 0 25%, #35d879 25% 70%, #178c55 70%);
      transform: rotate(45deg);
      box-shadow: 3px 3px 0 #105c39;
    }

    #player {
      position: absolute;
      z-index: 2;
      left: 0;
      bottom: var(--tile);
      width: var(--tile);
      height: calc(var(--tile) * 1.55);
      transition: left 120ms ease, bottom 180ms ease;
      image-rendering: pixelated;
    }
    #player.jumping { bottom: calc(var(--tile) * 2.25); }
    .head {
      position: absolute;
      top: 0;
      left: 9px;
      width: 26px;
      height: 25px;
      background: #c88c5b;
      border: 3px solid #70472e;
      box-shadow: inset 0 7px #654126;
    }
    .head::after {
      content: "";
      position: absolute;
      right: 3px;
      bottom: 5px;
      width: 4px;
      height: 4px;
      background: #222;
      box-shadow: -11px 0 #222;
    }
    .body-part {
      position: absolute;
      top: 23px;
      left: 8px;
      width: 28px;
      height: 23px;
      border: 3px solid #1f573b;
      background: #35a367;
    }
    .legs {
      position: absolute;
      top: 44px;
      left: 9px;
      width: 12px;
      height: 23px;
      background: #3156a0;
      box-shadow: 14px 0 #3156a0;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
    }
    button {
      border: 2px solid #345b38;
      border-radius: 6px;
      padding: 9px 14px;
      color: #17331e;
      background: #d8f0c5;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #c3e8a8; }
    button:focus-visible { outline: 3px solid #e39328; outline-offset: 2px; }
    #reset { margin-left: auto; background: #f4e4c5; }
    #message { min-height: 1.5em; margin: 12px 0 0; font-weight: 700; }
    .hint { margin: 4px 0 0; color: #425344; font-size: .9rem; }

    @keyframes glow { to { filter: brightness(1.25); } }

    @media (max-width: 760px) {
      :root { --tile: min(5.3vw, 44px); }
      .game-card { padding: 14px; }
      #world { margin-inline: auto; }
      .stone-block { left: calc(var(--tile) * 10); }
      #reset { margin-left: 0; }
    }
  </style>
</head>
<body>
  <main class="game-card">
    <h1>Blocky Mountain Run</h1>
    <p class="intro">Cross the lava, hop over the stone, and reach the emerald goal!</p>

    <div id="world" aria-label="A blocky game level with a lava pit and stone block">
      <div class="cloud one"></div>
      <div class="cloud two"></div>
      <div id="terrain" aria-hidden="true"></div>
      <div class="stone-block" aria-hidden="true"></div>
      <div class="emerald" aria-hidden="true"></div>
      <div id="player" aria-label="Player character">
        <div class="head"></div>
        <div class="body-part"></div>
        <div class="legs"></div>
      </div>
    </div>

    <div class="controls" aria-label="Game controls">
      <button id="left" type="button">◀ Left</button>
      <button id="jump" type="button">⬆ Jump</button>
      <button id="right" type="button">Right ▶</button>
      <button id="reset" type="button">Restart</button>
    </div>
    <p id="message" aria-live="polite">Use ← and → to move. Press Space or ↑ to jump.</p>
    <p class="hint">Tip: jump while standing near the lava or stone block.</p>
  </main>

  <script>
    // Each item is one column in the level. "lava" is dangerous; "ground" is safe.
    const level = [
      "ground", "ground", "lava", "ground", "ground",
      "lava", "lava", "lava",
      "ground", "ground", "ground", "ground", "ground", "ground", "ground", "ground"
    ];

    const terrain = document.querySelector("#terrain");
    const player = document.querySelector("#player");
    const message = document.querySelector("#message");

    let playerColumn = 0;
    let isJumping = false;
    let hasWon = false;
    let jumpTimer;

    // Draw one tile for each level entry so the level data controls the scenery.
    level.forEach((tileType, column) => {
      const tile = document.createElement("div");
      tile.classList.add("tile", tileType);
      tile.style.gridColumn = column + 1;
      terrain.appendChild(tile);
    });

    function updatePlayer() {
      // 44 pixels is the width of one tile in the game world.
      player.style.left = (playerColumn * 44) + "px";
    }

    function move(direction) {
      if (hasWon) return;

      const nextColumn = playerColumn + direction;
      if (nextColumn < 0 || nextColumn >= level.length) return;

      // The stone block is at column 10 and can only be crossed during a jump.
      const hitsStone = nextColumn === 10;
      if (hitsStone && !isJumping) {
        message.textContent = "There's a stone block in the way. Jump over it!";
        return;
      }

      playerColumn = nextColumn;
      updatePlayer();

      // Touching lava while grounded sends the player back to the start.
      if (level[playerColumn] === "lava" && !isJumping) {
        fallInLava();
        return;
      }

      if (playerColumn === level.length - 1) {
        hasWon = true;
        message.textContent = "You made it! The emerald goal is yours!";
      }
    }

    function jump() {
      if (hasWon || isJumping) return;

      isJumping = true;
      player.classList.add("jumping");
      message.textContent = "Nice jump! Move across the hazard before landing.";

      // After a short time, land. If the player is over lava, reset the level.
      jumpTimer = setTimeout(() => {
        isJumping = false;
        player.classList.remove("jumping");

        if (level[playerColumn] === "lava") {
          fallInLava();
        } else if (playerColumn === 10) {
          // Landing on the stone block would leave the player inside it.
          playerColumn = 9;
          updatePlayer();
          message.textContent = "You bumped the stone block. Try landing past it!";
        } else {
          message.textContent = "Landed safely. Keep moving toward the emerald!";
        }
      }, 850);
    }

    function fallInLava() {
      clearTimeout(jumpTimer);
      isJumping = false;
      player.classList.remove("jumping");
      playerColumn = 0;
      updatePlayer();
      message.textContent = "Sizzle! You fell in lava. Try that jump again.";
    }

    function restart() {
      clearTimeout(jumpTimer);
      playerColumn = 0;
      isJumping = false;
      hasWon = false;
      player.classList.remove("jumping");
      updatePlayer();
      message.textContent = "Use ← and → to move. Press Space or ↑ to jump.";
    }

    // Buttons make the game usable with a mouse or touchscreen.
    document.querySelector("#left").addEventListener("click", () => move(-1));
    document.querySelector("#right").addEventListener("click", () => move(1));
    document.querySelector("#jump").addEventListener("click", jump);
    document.querySelector("#reset").addEventListener("click", restart);

    // Keyboard controls call the same functions as the buttons.
    document.addEventListener("keydown", (event) => {
      if (["ArrowLeft", "ArrowRight", "ArrowUp", " "].includes(event.key)) {
        event.preventDefault();
      }
      if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") move(-1);
      if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") move(1);
      if (event.key === "ArrowUp" || event.key === " ") jump();
    });

    updatePlayer();
  </script>
</body>
</html>
